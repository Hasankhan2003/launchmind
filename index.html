<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Study Planner</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700;800;900&display=swap');
    :root {
      --primary-gradient: linear-gradient(135deg, #6366f1, #8b5cf6);
      --dark-background: #0f0f1a;
      --card-background: rgba(255,255,255,0.05);
      --card-border: 1px solid rgba(255,255,255,0.1);
      --text-primary: #f1f5f9;
      --text-secondary: #94a3b8;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--dark-background);
      color: var(--text-primary);
      line-height: 1.6;
    }
    header {
      position: sticky;
      top: 0;
      background-color: transparent;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem;
      backdrop-filter: blur(0px);
      transition: backdrop-filter 0.3s ease;
    }
    header.scrolled {
      backdrop-filter: blur(10px);
      background-color: var(--dark-background);
    }
    header nav a {
      text-decoration: none;
      color: var(--text-primary);
    }
    header nav button {
      background-color: var(--primary-gradient);
      color: var(--text-primary);
      border: none;
      padding: 0.5rem 1rem;
      font-size: 1rem;
      cursor: pointer;
      border-radius: 0.25rem;
    }
    header nav button:hover {
      box-shadow: 0 0 10px var(--primary-gradient);
    }
    main {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    section#hero {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background-image: linear-gradient(135deg, #6366f1, #8b5cf6);
    }
    section#hero::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: radial-gradient(50% 50% at 50% 50%, #ffffff 0%, #ffffff 100%);
      opacity: 0.1;
      animation: orb 10s infinite;
    }
    @keyframes orb {
      0% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.2);
      }
      100% {
        transform: scale(1);
      }
    }
    section#hero h1 {
      font-size: 2.5rem;
      font-weight: 700;
      color: var(--text-primary);
      animation: fadeInUp 1s;
    }
    section#hero p {
      font-size: 1.2rem;
      color: var(--text-secondary);
    }
    @keyframes fadeInUp {
      0% {
        opacity: 0;
        transform: translateY(20px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }
    footer {
      background-color: var(--dark-background);
      color: var(--text-primary);
      padding: 1rem;
      text-align: center;
    }
  </style>
</head>
<body>
  <header>
    <nav>
      <a href="#">Link 1</a>
      <a href="#">Link 2</a>
      <button>Button</button>
    </nav>
  </header>
  <main>
    <section id="hero">
      <h1>AI Study Planner</h1>
      <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed sit amet nulla auctor, vestibulum magna sed, convallis ex.</p>
    </section>
  </main>
  <footer>
    &copy; 2023 AI Study Planner
  </footer>
</body>
</html>
