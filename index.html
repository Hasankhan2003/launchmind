<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Study Planner</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700;800;900&display=swap');
    :root {
      --primary-gradient: linear-gradient(90deg, #6366f1, #8b5cf6);
      --dark-background: #0f0f1a;
      --card-background: rgba(255,255,255,0.05);
      --card-border: 1px solid rgba(255,255,255,0.1);
      --text-primary: #f1f5f9;
      --text-secondary: #94a3b8;
    }
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--dark-background);
      color: var(--text-primary);
    }
    header {
      position: sticky;
      top: 0;
      background-color: transparent;
      backdrop-filter: blur(0);
      transition: backdrop-filter 0.3s ease;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem;
    }
    header nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header nav .logo {
      font-weight: 600;
      font-size: 1.5rem;
    }
    header nav .get-started {
      background: var(--primary-gradient);
      color: var(--text-primary);
      border: none;
      padding: 0.5rem 1rem;
      font-size: 1rem;
      font-weight: 500;
      border-radius: 0.25rem;
      cursor: pointer;
    }
    header nav .get-started:hover {
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
    }
    main {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem;
    }
    #hero {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }
    #hero .headline {
      font-size: 2.5rem;
      font-weight: 700;
      margin-bottom: 1rem;
    }
    #hero .sub-headline {
      font-size: 1.5rem;
      font-weight: 500;
      margin-bottom: 2rem;
    }
    #hero .email-signup {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    #hero .email-signup input {
      padding: 0.5rem;
      font-size: 1rem;
      border: none;
      border-radius: 0.25rem;
      width: 100%;
      max-width: 300px;
    }
    #hero .email-signup button {
      background: var(--primary-gradient);
      color: var(--text-primary);
      border: none;
      padding: 0.5rem 1rem;
      font-size: 1rem;
      font-weight: 500;
      border-radius: 0.25rem;
      cursor: pointer;
    }
    #hero .email-signup button:hover {
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
    }
    .pricing-card {
      background: var(--card-background);
      border: var(--card-border);
      padding: 1rem;
      border-radius: 0.25rem;
      margin: 1rem;
      width: calc(33.33% - 2rem);
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
    }
    footer {
      background-color: transparent;
      padding: 1rem;
      text-align: center;
      color: var(--text-secondary);
    }
  </style>
</head>
<body>
  <header>
    <nav>
      <span class="logo">AI Study Planner</span>
      <button class="get-started">Get Started</button>
    </nav>
  </header>
  <main>
    <section id="hero">
      <h1 class="headline">AI Study Planner</h1>
      <p class="sub-headline">Plan your studies with AI</p>
      <div class="email-signup">
        <input type="email" placeholder="Enter your email">
        <button>Sign up</button>
      </div>
    </section>
    <section class="pricing">
      <h2>Pricing</h2>
      <div class="pricing-cards">
        <div class="pricing-card">
          <h3>Basic</h3>
          <p>$9.99/month</p>
        </div>
        <div class="pricing-card">
          <h3>Premium</h3>
          <p>$19.99/month</p>
        </div>
        <div class="pricing-card">
          <h3>Pro</h3>
          <p>$29.99/month</p>
        </div>
      </div>
    </section>
  </main>
  <footer>
    <p>&copy; 2024 AI Study Planner</p>
  </footer>
</body>
</html>
