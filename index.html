<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Study Planner</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap');
    :root {
      --indigo: #6366f1;
      --purple: #8b5cf6;
      --glass: rgba(255, 255, 255, 0.2);
    }
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }
    body {
      background: linear-gradient(135deg, var(--indigo), var(--purple));
      background-size: 400% 400%;
      animation: gradient 10s ease infinite;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    @keyframes gradient {
      0% {
        background-position: 0% 50%;
      }
      50% {
        background-position: 100% 50%;
      }
      100% {
        background-position: 0% 50%;
      }
    }
    .container {
      max-width: 1200px;
      margin: 40px auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .hero {
      background: var(--glass);
      border-radius: 20px;
      padding: 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
      animation: fade-in 1s ease-in-out;
    }
    @keyframes fade-in {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }
    .hero h1 {
      font-size: 36px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 10px;
    }
    .hero p {
      font-size: 18px;
      color: #fff;
      margin-bottom: 20px;
    }
    .hero button {
      background: var(--indigo);
      color: #fff;
      border: none;
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
      border-radius: 10px;
      transition: background 0.3s ease-in-out;
    }
    .hero button:hover {
      background: #5a5aff;
    }
    .features {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-top: 40px;
    }
    .feature {
      background: var(--glass);
      border-radius: 20px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
      margin-bottom: 20px;
    }
    .feature img {
      width: 40px;
      height: 40px;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="hero">
      <h1>AI Study Planner</h1>
      <p>Plan your studies with AI-powered tools</p>
      <button>Get Started</button>
    </div>
    <div class="features">
      <div class="feature">
        <img src="icon1.png" alt="Icon 1">
        <p>This is feature 1.</p>
      </div>
      <div class="feature">
        <img src="icon2.png" alt="Icon 2">
        <p>This is feature 2.</p>
      </div>
      <div class="feature">
        <img src="icon3.png" alt="Icon 3">
        <p>This is feature 3.</p>
      </div>
    </div>
  </div>
</body>
</html>
