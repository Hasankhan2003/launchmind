<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Study Planner</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
    :root {
      --primary-color: #6366f1;
      --secondary-color: #8b5cf6;
      --background-color: linear-gradient(180deg, #6366f1 0%, #8b5cf6 100%);
      --glass-color: rgba(255, 255, 255, 0.2);
      --box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--background-color);
      color: #fff;
      line-height: 1.6;
      padding: 2rem;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .hero {
      background: var(--glass-color);
      padding: 4rem;
      border-radius: 1rem;
      box-shadow: var(--box-shadow);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      animation: fade-in 1s;
    }
    .hero h1 {
      font-size: 2.5rem;
      font-weight: 700;
      margin-bottom: 1rem;
    }
    .hero p {
      font-size: 1.2rem;
      margin-bottom: 2rem;
    }
    .hero button {
      background: var(--primary-color);
      color: #fff;
      border: none;
      padding: 1rem 2rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      border-radius: 0.5rem;
      animation: fade-in 1s;
    }
    .hero button:hover {
      background: var(--secondary-color);
    }
    .features {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 4rem;
    }
    .feature {
      background: var(--glass-color);
      padding: 2rem;
      border-radius: 1rem;
      box-shadow: var(--box-shadow);
      margin: 1rem;
    }
  </style>
</head>
<header>
  <nav class="container">
    <!-- Navigation menu will go here -->
  </nav>
</header>
<main class="container">
  <section class="hero">
    <h1>AI Study Planner</h1>
    <p>Plan your studies with AI</p>
    <button>Get Started</button>
  </section>
  <section class="features">
    <article class="feature">
      <h2>Feature 1</h2>
      <p>Description of feature 1</p>
    </article>
    <article class="feature">
      <h2>Feature 2</h2>
      <p>Description of feature 2</p>
    </article>
    <article class="feature">
      <h2>Feature 3</h2>
      <p>Description of feature 3</p>
    </article>
  </section>
</main>
<footer>
  <!-- Footer content will go here -->
</footer>
</html>
